name: update
on:
  push:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install dependencies
        run: |
          # pnpm's SQLite store index intermittently fails to open on hosted
          # macOS runners, which no retry inside pnpm covers.
          for attempt in 1 2 3; do
            make deps && exit 0
            echo "::warning::make deps failed (attempt $attempt)"
            sleep 5
          done
          exit 1
      - name: Update cards
        run: |
          make
        env:
          # A separate personal access token is required to read public repos.
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      - name: Commit and push changes
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'Update cards (from GitHub Actions)'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
